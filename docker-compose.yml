version: '3.8'

services:
  backend:
    build: .
    container_name: superapp-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=superapp_secret_key_2024_cambiar_en_produccion
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: superapp-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=superapp
      - POSTGRES_PASSWORD=superapp123
      - POSTGRES_DB=superapp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  admin:
    build: ../superapp-admin
    container_name: superapp-admin
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    volumes:
      - ../superapp-admin:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data: